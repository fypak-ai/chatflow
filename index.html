<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Serper - Pesquisa em Português</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        
        .search-box { margin-bottom: 1rem; }
        .search-box form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 1rem;
            border-radius: 50px;
            border: 2px solid #333;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }
        .search-box input:focus { border-color: #00d4ff; outline: none; }
        .search-box button {
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(90deg, #00d4ff, #a855f7);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        
        .lang-select {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .lang-select label { color: #94a3b8; font-size: 0.9rem; }
        .lang-select select {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            cursor: pointer;
        }
        
        .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .tab {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            background: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            border: 1px solid #334155;
            font-size: 0.9rem;
        }
        .tab:hover { background: #334155; }
        .tab.active { background: #00d4ff; color: #000; border-color: #00d4ff; }
        
        .error { background: #7f1d1d; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; color: #fca5a5; }
        .loading { text-align: center; padding: 2rem; color: #64748b; }
        
        .result {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }
        .result a { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 1.1rem; }
        .result a:hover { text-decoration: underline; }
        .result .url { color: #22c55e; font-size: 0.85rem; margin: 0.5rem 0; }
        .result .snippet { color: #cbd5e1; line-height: 1.6; }
        
        .knowledge-panel {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 2px solid #00d4ff;
        }
        .knowledge-panel h2 { color: #00d4ff; margin-bottom: 0.5rem; }
        .knowledge-panel .subtitle { color: #a855f7; margin-bottom: 1rem; }
        .knowledge-panel .desc { color: #cbd5e1; margin-bottom: 1rem; }
        .kg-attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
        .kg-attr { background: #0f172a; padding: 0.75rem; border-radius: 8px; }
        .kg-attr-label { color: #64748b; font-size: 0.75rem; }
        .kg-attr-value { color: #fff; font-size: 0.9rem; margin-top: 0.25rem; }
        
        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
        .image-card { background: #1e293b; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .image-card img { width: 100%; height: 140px; object-fit: cover; }
        
        .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .video-card { background: #1e293b; border-radius: 12px; overflow: hidden; }
        .video-card img { width: 100%; height: 150px; object-fit: cover; }
        .video-card .info { padding: 0.75rem; }
        .video-card .title { color: #fff; font-size: 0.9rem; }
        .video-card .channel { color: #64748b; font-size: 0.8rem; margin-top: 0.25rem; }
        
        .shopping-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .shopping-card { background: #1e293b; border-radius: 12px; padding: 1rem; }
        .shopping-card img { width: 100%; height: 120px; object-fit: contain; background: #fff; border-radius: 8px; }
        .shopping-card .title { color: #cbd5e1; font-size: 0.85rem; margin: 0.75rem 0 0.5rem; }
        .shopping-card .price { color: #22c55e; font-weight: bold; font-size: 1.1rem; }
        
        .paa-item { background: #1e293b; border-radius: 8px; margin-bottom: 0.75rem; overflow: hidden; }
        .paa-question { padding: 1rem; cursor: pointer; color: #38bdf8; font-weight: 600; }
        .paa-answer { padding: 0 1rem 1rem; color: #94a3b8; font-size: 0.9rem; display: none; }
        .paa-item.open .paa-answer { display: block; }
        
        .related { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .related-search { background: #1e293b; padding: 0.5rem 1rem; border-radius: 20px; color: #94a3b8; font-size: 0.85rem; cursor: pointer; }
        .related-search:hover { background: #334155; color: #fff; }
        
        .place-card { background: #1e293b; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
        .place-card h3 { color: #fff; margin-bottom: 0.5rem; }
        .place-card .address { color: #64748b; font-size: 0.9rem; }
        
        .scholar-result { background: #1e293b; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
        .scholar-result .authors { color: #a855f7; font-size: 0.85rem; }
        .scholar-result .venue { color: #64748b; font-size: 0.85rem; }
        
        .footer { text-align: center; padding: 2rem; color: #64748b; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Serper</h1>
    </div>
    
    <div class="container">
        <div class="search-box">
            <form id="search-form">
                <input type="text" id="query" placeholder="Pesquise...">
                <button type="submit">Buscar</button>
            </form>
        </div>
        
        <div class="lang-select">
            <label>🌐 Idioma:</label>
            <select id="language">
                <option value="pt-br,pt">Português (Brasil)</option>
                <option value="pt-pt,pt">Português (Portugal)</option>
                <option value="en-us,en">English (US)</option>
                <option value="es-es,es">Español</option>
                <option value="">Todos os idiomas</option>
            </select>
            <label>📝 Traduzir resultados:</label>
            <input type="checkbox" id="translate" checked>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-type="search" onclick="setTab('search')">🌐 Web</div>
            <div class="tab" data-type="images" onclick="setTab('images')">🖼️ Imagens</div>
            <div class="tab" data-type="news" onclick="setTab('news')">📰 Notícias</div>
            <div class="tab" data-type="videos" onclick="setTab('videos')">🎬 Vídeos</div>
            <div class="tab" data-type="shopping" onclick="setTab('shopping')">🛒 Shopping</div>
            <div class="tab" data-type="places" onclick="setTab('places')">📍 Locais</div>
        </div>
        
        <div id="error"></div>
        <div id="results"></div>
    </div>
    
    <div class="footer">Powered by Serper.dev</div>

    <script>
        const API_KEY = 'c16e7b0634206ae7f8faf87fa57feb554395bad8';
        let currentType = 'search';
        
        // Simple translation dictionary
        const translations = {
            'People also ask': 'As pessoas também perguntam',
            'Related searches': 'Buscas relacionadas',
            'Description': 'Descrição',
            'Founded': 'Fundado',
            'Headquarters': 'Sede',
            'CEO': 'CEO',
            'Revenue': 'Receita',
            'Employees': 'Funcionários',
            'Website': 'Website',
            'Industry': 'Indústria',
            'Founder': 'Fundador',
            'Products': 'Produtos',
            'Services': 'Serviços'
        };
        
        function translateText(text) {
            if (!document.getElementById('translate').checked) return text;
            if (!text) return text;
            
            let result = text;
            for (const [eng, pt] of Object.entries(translations)) {
                result = result.replace(new RegExp(eng, 'gi'), pt);
            }
            return result;
        }
        
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            
            if (!query.trim()) return;
            
            results.innerHTML = '<div class="loading">Carregando...</div>';
            error.innerHTML = '';
            
            try {
                const language = document.getElementById('language').value.split(',')[0];
                const body = { q: query, num: 20 };
                if (language) body.hl = language;
                
                const response = await fetch('https://google.serper.dev/' + getEndpoint(currentType), {
                    method: 'POST',
                    headers: { 'X-API-KEY': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) throw new Error('Erro ' + response.status);
                const data = await response.json();
                
                renderResults(data);
            } catch (err) {
                error.innerHTML = '<div class="error">' + err.message + '</div>';
                results.innerHTML = '';
            }
        });
        
        function getEndpoint(type) {
            const endpoints = {
                'search': 'search',
                'images': 'images',
                'news': 'news',
                'videos': 'videos',
                'shopping': 'shopping',
                'places': 'places'
            };
            return endpoints[type] || 'search';
        }
        
        function renderResults(data) {
            const results = document.getElementById('results');
            
            switch(currentType) {
                case 'search': renderSearch(data, results); break;
                case 'images': renderImages(data, results); break;
                case 'news': renderNews(data, results); break;
                case 'videos': renderVideos(data, results); break;
                case 'shopping': renderShopping(data, results); break;
                case 'places': renderPlaces(data, results); break;
                default: results.innerHTML = '<div class="loading">Nenhum resultado</div>';
            }
        }
        
        function renderSearch(data, container) {
            let html = '';
            
            // Knowledge Panel
            if (data.knowledgeGraph) {
                const kg = data.knowledgeGraph;
                html += '<div class="knowledge-panel">';
                if (kg.title) html += '<h2>' + translateText(kg.title) + '</h2>';
                if (kg.subTitle) html += '<div class="subtitle">' + translateText(kg.subTitle) + '</div>';
                if (kg.description) html += '<div class="desc">' + translateText(kg.description) + '</div>';
                if (kg.attributes) {
                    html += '<div class="kg-attrs">';
                    for (const [k, v] of Object.entries(kg.attributes)) {
                        html += '<div class="kg-attr"><div class="kg-attr-label">' + translateText(k) + '</div><div class="kg-attr-value">' + v + '</div></div>';
                    }
                    html += '</div>';
                }
                html += '</div>';
            }
            
            // People Also Ask
            if (data.peopleAlsoAsk) {
                data.peopleAlsoAsk.forEach(item => {
                    html += '<div class="paa-item" onclick="this.classList.toggle(\'open\')">';
                    html += '<div class="paa-question">' + translateText(item.question) + '</div>';
                    html += '<div class="paa-answer">' + translateText(item.answer) + '</div>';
                    html += '</div>';
                });
            }
            
            // Organic Results
            if (data.organic) {
                data.organic.forEach(item => {
                    html += '<div class="result">';
                    html += '<a href="' + item.link + '" target="_blank">' + translateText(item.title) + '</a>';
                    html += '<div class="url">' + item.link + '</div>';
                    html += '<div class="snippet">' + translateText(item.snippet || '') + '</div>';
                    html += '</div>';
                });
            }
            
            // Related Searches
            if (data.relatedSearches) {
                html += '<div class="related">';
                data.relatedSearches.forEach(item => {
                    html += '<div class="related-search" onclick="document.getElementById(\'query\').value=\'' + item.query + '\';document.getElementById(\'search-form\').submit()">' + item.query + '</div>';
                });
                html += '</div>';
            }
            
            container.innerHTML = html || '<div class="loading">Nenhum resultado encontrado</div>';
        }
        
        function renderImages(data, container) {
            const images = data.images || [];
            if (!images.length) { container.innerHTML = '<div class="loading">Nenhuma imagem</div>'; return; }
            
            let html = '<div class="images-grid">';
            images.forEach(img => {
                html += '<div class="image-card" onclick="window.open(\'' + img.imageUrl + '\', \'_blank\')">';
                html += '<img src="' + img.imageUrl + '" alt="Image"></div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderVideos(data, container) {
            const videos = data.videos || [];
            if (!videos.length) { container.innerHTML = '<div class="loading">Nenhum vídeo</div>'; return; }
            
            let html = '<div class="videos-grid">';
            videos.forEach(vid => {
                html += '<div class="video-card" onclick="window.open(\'' + vid.link + '\', \'_blank\')">';
                html += '<img src="' + (vid.thumbnail || '') + '" alt="Video">';
                html += '<div class="info"><div class="title">' + translateText(vid.title) + '</div>';
                html += '<div class="channel">' + translateText(vid.channel || '') + '</div></div></div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderNews(data, container) {
            const news = data.news || [];
            if (!news.length) { container.innerHTML = '<div class="loading">Nenhuma notícia</div>'; return; }
            
            let html = '';
            news.forEach(item => {
                html += '<div class="result">';
                html += '<div style="color:#a855f7;font-size:0.8rem;margin-bottom:0.25rem">' + translateText(item.source) + '</div>';
                html += '<a href="' + item.link + '" target="_blank">' + translateText(item.title) + '</a>';
                html += '<div class="snippet">' + translateText(item.snippet || '') + '</div></div>';
            });
            container.innerHTML = html;
        }
        
        function renderShopping(data, container) {
            const shopping = data.shopping || [];
            if (!shopping.length) { container.innerHTML = '<div class="loading">Nenhum resultado</div>'; return; }
            
            let html = '<div class="shopping-grid">';
            shopping.forEach(item => {
                html += '<div class="shopping-card">';
                html += '<img src="' + (item.thumbnail || '') + '" alt="' + item.title + '">';
                html += '<div class="title">' + translateText(item.title) + '</div>';
                html += '<div class="price">' + translateText(item.price || '') + '</div>';
                html += '</div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderPlaces(data, container) {
            const places = data.places || [];
            if (!places.length) { container.innerHTML = '<div class="loading">Nenhum local</div>'; return; }
            
            let html = '';
            places.forEach(place => {
                html += '<div class="place-card">';
                html += '<h3>' + translateText(place.title) + '</h3>';
                html += '<div class="address">' + translateText(place.address || '') + '</div>';
                html += '</div>';
            });
            container.innerHTML = html;
        }
        
        function setTab(type) {
            currentType = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
            document.getElementById('results').innerHTML = '';
            document.getElementById('error').innerHTML = '';
        }
    </script>
</body>
</html>
