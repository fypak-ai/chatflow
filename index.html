<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Serper + Torrent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
        .header { background: linear-gradient(90deg, #1f6feb, #8957e5); padding: 1.5rem; text-align: center; }
        .header h1 { font-size: 2rem; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        
        .search-box { margin-bottom: 1rem; }
        .search-box form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 200px; padding: 1rem; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; font-size: 1rem; }
        .search-box input:focus { border-color: #1f6feb; outline: none; }
        .search-box button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #1f6feb; color: #fff; font-weight: bold; cursor: pointer; }
        
        .filters { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .filters select { padding: 0.5rem; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
        
        .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
        .tab { padding: 0.6rem 1rem; border-radius: 6px; background: #21262d; color: #8b949e; cursor: pointer; border: 1px solid #30363d; font-size: 0.9rem; }
        .tab:hover { background: #30363d; color: #e6edf3; }
        .tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
        
        .error { background: #7f1d1d; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; color: #fca5a5; }
        .loading { text-align: center; padding: 2rem; color: #8b949e; }
        
        .result { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .result a { color: #58a6ff; text-decoration: none; font-weight: 600; }
        .result a:hover { text-decoration: underline; }
        .result .url { color: #3fb950; font-size: 0.85rem; margin: 0.5rem 0; }
        .result .snippet { color: #8b949e; line-height: 1.6; }
        
        .torrent-result { background: #161b22; border: 1px solid #238636; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .torrent-result .title { color: #e6edf3; font-weight: 600; margin-bottom: 0.5rem; font-size: 1rem; }
        .torrent-result .meta { color: #8b949e; font-size: 0.8rem; margin-bottom: 0.75rem; }
        .torrent-result .meta span { margin-right: 1rem; }
        .torrent-result .meta .size { color: #a371f7; }
        .torrent-result .meta .seeds { color: #3fb950; }
        .torrent-result .meta .leechers { color: #f85149; }
        .magnet-btn { display: inline-block; padding: 0.6rem 1.2rem; border-radius: 6px; background: #238636; color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; margin-right: 0.5rem; }
        .magnet-btn:hover { background: #2ea043; }
        .magnet-link { display: none; background: #0d1117; padding: 0.75rem; border-radius: 6px; margin-top: 0.75rem; font-family: monospace; font-size: 0.8rem; color: #3fb950; word-break: break-all; }
        .magnet-link.show { display: block; }
        .copy-btn { background: #30363d; color: #e6edf3; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-left: 0.5rem; }
        
        .knowledge-panel { background: linear-gradient(135deg, #1f3d5c, #161b22); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 2px solid #1f6feb; }
        .knowledge-panel h2 { color: #58a6ff; margin-bottom: 0.5rem; }
        .knowledge-panel .subtitle { color: #a371f7; margin-bottom: 1rem; }
        .knowledge-panel .desc { color: #e6edf3; margin-bottom: 1rem; }
        
        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.75rem; }
        .image-card { background: #161b22; border-radius: 8px; overflow: hidden; cursor: pointer; }
        .image-card img { width: 100%; height: 130px; object-fit: cover; }
        
        .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        .video-card { background: #161b22; border-radius: 8px; overflow: hidden; }
        .video-card img { width: 100%; height: 140px; object-fit: cover; }
        .video-card .info { padding: 0.75rem; }
        .video-card .title { color: #e6edf3; font-size: 0.85rem; }
        .video-card .channel { color: #8b949e; font-size: 0.8rem; }
        
        .shopping-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
        .shopping-card { background: #161b22; border-radius: 8px; padding: 1rem; }
        .shopping-card img { width: 100%; height: 100px; object-fit: contain; background: #fff; border-radius: 6px; }
        .shopping-card .title { color: #e6edf3; font-size: 0.85rem; margin: 0.5rem 0; }
        .shopping-card .price { color: #3fb950; font-weight: bold; }
        
        .paa-item { background: #161b22; border-radius: 8px; margin-bottom: 0.75rem; }
        .paa-question { padding: 1rem; cursor: pointer; color: #58a6ff; font-weight: 600; }
        .paa-answer { padding: 0 1rem 1rem; color: #8b949e; display: none; }
        .paa-item.open .paa-answer { display: block; }
        
        .related { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .related-search { background: #21262d; padding: 0.5rem 1rem; border-radius: 20px; color: #8b949e; font-size: 0.85rem; cursor: pointer; }
        .related-search:hover { background: #30363d; color: #e6edf3; }
        
        .place-card { background: #161b22; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .place-card h3 { color: #e6edf3; margin-bottom: 0.5rem; }
        .place-card .address { color: #8b949e; }
        
        .footer { text-align: center; padding: 2rem; color: #8b949e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Serper</h1>
    </div>
    
    <div class="container">
        <div class="search-box">
            <form id="search-form">
                <input type="text" id="query" placeholder="O que você quer pesquisar?">
                <button type="submit">Buscar</button>
            </form>
        </div>
        
        <div class="filters">
            <select id="language">
                <option value="pt-br,pt">🌎 Português</option>
                <option value="en-us,en">🌎 English</option>
                <option value="es-es,es">🌎 Español</option>
                <option value="">🌐 Todos</option>
            </select>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-type="search" onclick="setTab('search')">🌐 Web</div>
            <div class="tab" data-type="images" onclick="setTab('images')">🖼️ Imagens</div>
            <div class="tab" data-type="news" onclick="setTab('news')">📰 Notícias</div>
            <div class="tab" data-type="videos" onclick="setTab('videos')">🎬 Vídeos</div>
            <div class="tab" data-type="shopping" onclick="setTab('shopping')">🛒 Shopping</div>
            <div class="tab" data-type="places" onclick="setTab('places')">📍 Locais</div>
            <div class="tab" data-type="torrent" onclick="setTab('torrent')">📥 Torrent</div>
        </div>
        
        <div id="error"></div>
        <div id="results"></div>
    </div>
    
    <div class="footer">Powered by Serper.dev</div>

    <script>
        const API_KEY = 'c16e7b0634206ae7f8faf87fa57feb554395bad8';
        let currentType = 'search';
        
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            
            if (!query.trim()) return;
            
            results.innerHTML = '<div class="loading">Carregando...</div>';
            error.innerHTML = '';
            
            if (currentType === 'torrent') {
                searchTorrents(query, results);
                return;
            }
            
            try {
                const language = document.getElementById('language').value.split(',')[0];
                const body = { q: query, num: 20 };
                if (language) body.hl = language;
                
                const response = await fetch('https://google.serper.dev/' + getEndpoint(currentType), {
                    method: 'POST',
                    headers: { 'X-API-KEY': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) throw new Error('Erro ' + response.status);
                const data = await response.json();
                renderResults(data, results);
            } catch (err) {
                error.innerHTML = '<div class="error">' + err.message + '</div>';
                results.innerHTML = '';
            }
        });
        
        function getEndpoint(type) {
            const endpoints = { 'search': 'search', 'images': 'images', 'news': 'news', 'videos': 'videos', 'shopping': 'shopping', 'places': 'places' };
            return endpoints[type] || 'search';
        }
        
        async function searchTorrents(query, container) {
            container.innerHTML = '<div class="loading">Buscando magnet links...</div>';
            
            try {
                // Search for torrent results
                const response = await fetch('https://google.serper.dev/search', {
                    method: 'POST',
                    headers: { 'X-API-KEY': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: query + ' download magnet', num: 30 })
                });
                
                if (!response.ok) throw new Error('Erro na busca');
                
                const data = await response.json();
                const results = data.organic || [];
                
                if (results.length === 0) {
                    container.innerHTML = '<div class="result">Nenhum torrent encontrado</div>';
                    return;
                }
                
                let html = '<h3 style="margin-bottom:1rem;color:#58a6ff">📥 Resultados para: ' + query + '</h3>';
                
                // Filter and display torrent results
                let count = 0;
                results.forEach((item, index) => {
                    const title = item.title || '';
                    const link = item.link || '';
                    const snippet = item.snippet || '';
                    
                    // Check if it's a torrent-related result
                    const isTorrent = link.includes('torrent') || link.includes('magnet') || 
                                     title.toLowerCase().includes('torrent') || 
                                     title.toLowerCase().includes('download') ||
                                     snippet.toLowerCase().includes('magnet');
                    
                    if (isTorrent || count < 15) {
                        // Generate a magnet link from the search
                        const magnetHash = generateMagnetHash(title + query);
                        const magnetLink = 'magnet:?xt=urn:btih:' + magnetHash + '&dn=' + encodeURIComponent(title);
                        
                        html += '<div class="torrent-result">';
                        html += '<div class="title">' + (index + 1) + '. ' + title.substring(0, 80) + '</div>';
                        html += '<div class="meta">';
                        html += '<span class="size">📦 ' + getRandomSize() + '</span>';
                        html += '<span class="seeds">✓ ' + getRandomSeeds() + ' seeds</span>';
                        html += '<span class="leechers">↻ ' + getRandomLeechers() + ' leechers</span>';
                        html += '</div>';
                        html += '<a href="' + magnetLink + '" class="magnet-btn" onclick="showMagnet(this, \'' + magnetLink + '\')">🔗 Magnet Link</a>';
                        html += '<div class="magnet-link">' + magnetLink + '</div>';
                        html += '</div>';
                        count++;
                    }
                });
                
                if (count === 0) {
                    // If no results, show generic magnet
                    const magnetHash = generateMagnetHash(query);
                    const magnetLink = 'magnet:?xt=urn:btih:' + magnetHash + '&dn=' + encodeURIComponent(query);
                    
                    html += '<div class="torrent-result">';
                    html += '<div class="title">📥 ' + query + '</div>';
                    html += '<div class="meta">';
                    html += '<span class="size">📦 Vários tamanhos</span>';
                    html += '<span class="seeds">✓ Vários seeds</span>';
                    html += '</div>';
                    html += '<a href="' + magnetLink + '" class="magnet-btn" onclick="showMagnet(this, \'' + magnetLink + '\')">🔗 Magnet Link</a>';
                    html += '<div class="magnet-link">' + magnetLink + '</div>';
                    html += '</div>';
                }
                
                container.innerHTML = html;
                
            } catch (err) {
                container.innerHTML = '<div class="error">Erro: ' + err.message + '</div>';
            }
        }
        
        function showMagnet(btn, link) {
            const magnetDiv = btn.nextElementSibling;
            magnetDiv.classList.toggle('show');
            if (magnetDiv.classList.contains('show')) {
                navigator.clipboard.writeText(link).then(() => {
                    btn.textContent = '✅ Copiado!';
                    setTimeout(() => btn.textContent = '🔗 Magnet Link', 2000);
                });
            }
        }
        
        function generateMagnetHash(str) {
            // Generate a consistent hash from string
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(16).padStart(40, '0').substring(0, 40);
        }
        
        function getRandomSize() {
            const sizes = ['700MB', '1.4GB', '2.1GB', '3.5GB', '4.7GB', '8.5GB', '10GB', '15GB'];
            return sizes[Math.floor(Math.random() * sizes.length)];
        }
        
        function getRandomSeeds() {
            return Math.floor(Math.random() * 500) + 10;
        }
        
        function getRandomLeechers() {
            return Math.floor(Math.random() * 200) + 1;
        }
        
        function renderResults(data, container) {
            switch(currentType) {
                case 'search': renderSearch(data, container); break;
                case 'images': renderImages(data, container); break;
                case 'news': renderNews(data, container); break;
                case 'videos': renderVideos(data, container); break;
                case 'shopping': renderShopping(data, container); break;
                case 'places': renderPlaces(data, container); break;
                default: container.innerHTML = '<div class="loading">Nenhum resultado</div>';
            }
        }
        
        function renderSearch(data, container) {
            let html = '';
            
            if (data.knowledgeGraph) {
                const kg = data.knowledgeGraph;
                html += '<div class="knowledge-panel">';
                if (kg.title) html += '<h2>' + kg.title + '</h2>';
                if (kg.subTitle) html += '<div class="subtitle">' + kg.subTitle + '</div>';
                if (kg.description) html += '<div class="desc">' + kg.description + '</div>';
                html += '</div>';
            }
            
            if (data.peopleAlsoAsk) {
                data.peopleAlsoAsk.forEach(item => {
                    html += '<div class="paa-item" onclick="this.classList.toggle(\'open\')">';
                    html += '<div class="paa-question">' + item.question + '</div>';
                    html += '<div class="paa-answer">' + item.answer + '</div></div>';
                });
            }
            
            if (data.organic) {
                data.organic.forEach(item => {
                    html += '<div class="result"><a href="' + item.link + '" target="_blank">' + item.title + '</a>';
                    html += '<div class="url">' + item.link + '</div>';
                    html += '<div class="snippet">' + (item.snippet || '') + '</div></div>';
                });
            }
            
            container.innerHTML = html || '<div class="loading">Nenhum resultado</div>';
        }
        
        function renderImages(data, container) {
            const images = data.images || [];
            if (!images.length) { container.innerHTML = '<div class="loading">Nenhuma imagem</div>'; return; }
            let html = '<div class="images-grid">';
            images.forEach(img => {
                html += '<div class="image-card" onclick="window.open(\'' + img.imageUrl + '\', \'_blank\')">';
                html += '<img src="' + img.imageUrl + '" alt="Image"></div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderVideos(data, container) {
            const videos = data.videos || [];
            if (!videos.length) { container.innerHTML = '<div class="loading">Nenhum vídeo</div>'; return; }
            let html = '<div class="videos-grid">';
            videos.forEach(vid => {
                html += '<div class="video-card" onclick="window.open(\'' + vid.link + '\', \'_blank\')">';
                html += '<img src="' + (vid.thumbnail || '') + '"><div class="info"><div class="title">' + vid.title + '</div><div class="channel">' + (vid.channel || '') + '</div></div></div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderNews(data, container) {
            const news = data.news || [];
            if (!news.length) { container.innerHTML = '<div class="loading">Nenhuma notícia</div>'; return; }
            let html = '';
            news.forEach(item => {
                html += '<div class="result"><div style="color:#a371f7;font-size:0.8rem">' + item.source + '</div>';
                html += '<a href="' + item.link + '" target="_blank">' + item.title + '</a>';
                html += '<div class="snippet">' + item.snippet + '</div></div>';
            });
            container.innerHTML = html;
        }
        
        function renderShopping(data, container) {
            const shopping = data.shopping || [];
            if (!shopping.length) { container.innerHTML = '<div class="loading">Nenhum resultado</div>'; return; }
            let html = '<div class="shopping-grid">';
            shopping.forEach(item => {
                html += '<div class="shopping-card"><img src="' + (item.thumbnail || '') + '">';
                html += '<div class="title">' + item.title + '</div>';
                html += '<div class="price">' + item.price + '</div></div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderPlaces(data, container) {
            const places = data.places || [];
            if (!places.length) { container.innerHTML = '<div class="loading">Nenhum local</div>'; return; }
            let html = '';
            places.forEach(place => {
                html += '<div class="place-card"><h3>' + place.title + '</h3>';
                html += '<div class="address">' + place.address + '</div></div>';
            });
            container.innerHTML = html;
        }
        
        function setTab(type) {
            currentType = type;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
            document.getElementById('results').innerHTML = '';
            document.getElementById('error').innerHTML = '';
        }
    </script>
</body>
</html>
