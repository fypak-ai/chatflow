<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Serper Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%);
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.4);
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .search-box {
            margin-bottom: 2rem;
        }
        .search-box form {
            display: flex;
            gap: 0.5rem;
        }
        .search-box input {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
        }
        .search-box input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .search-box button {
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .search-box button:hover {
            opacity: 0.9;
        }
        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .tab {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(90deg, rgba(0,212,255,0.2), rgba(124,58,237,0.2));
            color: #fff;
            border-color: #00d4ff;
        }
        .tab:hover:not(.active) {
            background: rgba(255,255,255,0.1);
        }
        
        .results { margin-top: 1rem; }
        
        .result {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .result:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(0,212,255,0.3);
        }
        .result a {
            color: #00d4ff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .result .url {
            color: #4ade80;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }
        .result .snippet {
            color: #aaa;
            line-height: 1.6;
            font-size: 0.9rem;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .image-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        .image-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .image-card .title {
            padding: 0.75rem;
            font-size: 0.8rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .news-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .news-card .source {
            color: #7c3aed;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .news-card .date {
            color: #666;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }
        .news-card a {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin: 0.5rem 0;
        }
        .news-card a:hover {
            color: #00d4ff;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .stats {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
        
        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Serper Search</h1>
    </div>
    
    <div class="container">
        <div class="search-box">
            <form id="search-form">
                <input type="text" id="query" placeholder="O que você quer pesquisar?" required>
                <button type="submit" id="search-btn">🔍 Pesquisar</button>
            </form>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-type="web" onclick="setTab('web')">🌐 Web</div>
            <div class="tab" data-type="images" onclick="setTab('images')">🖼️ Imagens</div>
            <div class="tab" data-type="news" onclick="setTab('news')">📰 Notícias</div>
            <div class="tab" data-type="videos" onclick="setTab('videos')">🎬 Vídeos</div>
        </div>
        
        <div id="stats" class="stats" style="display:none"></div>
        <div id="error" class="error" style="display:none"></div>
        <div id="results" class="results"></div>
    </div>
    
    <div class="footer">
        Powered by <a href="https://serper.dev" target="_blank" style="color:#00d4ff">Serper.dev</a>
    </div>

    <script>
        const API_KEY = 'c16e7b0634206ae7f8faf87fa57feb554395bad8';
        let currentType = 'web';
        
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            const btn = document.getElementById('search-btn');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            const stats = document.getElementById('stats');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Pesquisando...';
            error.style.display = 'none';
            results.innerHTML = '';
            
            try {
                const response = await fetch(`https://google.serper.dev/${currentType}`, {
                    method: 'POST',
                    headers: {
                        'X-API-KEY': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ q: query })
                });
                
                if (!response.ok) throw new Error('Erro na API: ' + response.status);
                
                const data = await response.json();
                
                // Show stats
                if (data.searchInformation) {
                    stats.innerHTML = `Encontrado em ${data.searchInformation.formattedSearchTime ? data.searchInformation.formattedSearchTime + 's' : '?'}`;
                    stats.style.display = 'block';
                }
                
                // Render results based on type
                if (currentType === 'web') {
                    renderWebResults(data);
                } else if (currentType === 'images') {
                    renderImageResults(data);
                } else if (currentType === 'news') {
                    renderNewsResults(data);
                } else if (currentType === 'videos') {
                    renderVideoResults(data);
                }
                
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
            }
            
            btn.disabled = false;
            btn.innerHTML = '🔍 Pesquisar';
        });
        
        function renderWebResults(data) {
            const results = document.getElementById('results');
            if (!data.organic || data.organic.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhum resultado encontrado</p>';
                return;
            }
            
            results.innerHTML = data.organic.map(item => `
                <div class="result">
                    <a href="${item.link}" target="_blank">${item.title}</a>
                    <div class="url">${item.link}</div>
                    <div class="snippet">${item.snippet || ''}</div>
                </div>
            `).join('');
        }
        
        function renderImageResults(data) {
            const results = document.getElementById('results');
            if (!data.images || data.images.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhuma imagem encontrada</p>';
                return;
            }
            
            results.innerHTML = '<div class="image-grid">' + data.images.map(item => `
                <div class="image-card">
                    <img src="${item.imageUrl}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
                    <div class="title">${item.title || ''}</div>
                </div>
            `).join('') + '</div>';
        }
        
        function renderNewsResults(data) {
            const results = document.getElementById('results');
            if (!data.news || data.news.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhuma notícia encontrada</p>';
                return;
            }
            
            results.innerHTML = data.news.map(item => `
                <div class="news-card">
                    <span class="source">${item.source}</span>
                    <span class="date">${item.date || ''}</span>
                    <a href="${item.link}" target="_blank">${item.title}</a>
                    <div class="snippet">${item.snippet || ''}</div>
                </div>
            `).join('');
        }
        
        function renderVideoResults(data) {
            const results = document.getElementById('results');
            if (!data.videos || data.videos.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhum vídeo encontrado</p>';
                return;
            }
            
            results.innerHTML = data.videos.map(item => `
                <div class="result">
                    <a href="${item.link}" target="_blank">🎬 ${item.title}</a>
                    <div class="url">${item.channel} • ${item.duration || ''}</div>
                </div>
            `).join('');
        }
        
        function setTab(type) {
            currentType = type;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });
        }
    </script>
</body>
</html>
