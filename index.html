<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Serper Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%);
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.4);
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        .search-box { margin-bottom: 2rem; }
        .search-box form { display: flex; gap: 0.5rem; }
        .search-box input {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
        }
        .search-box input:focus { outline: none; border-color: #00d4ff; }
        .search-box button {
            padding: 1rem 2rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .search-box button:hover { opacity: 0.9; }
        .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .tab {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(90deg, rgba(0,212,255,0.2), rgba(124,58,237,0.2));
            color: #fff;
            border-color: #00d4ff;
        }
        .tab:hover:not(.active) { background: rgba(255,255,255,0.1); }
        
        .results { margin-top: 1rem; }
        
        .result {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .result a { color: #00d4ff; text-decoration: none; font-size: 1.1rem; font-weight: 600; }
        .result .url { color: #4ade80; font-size: 0.85rem; margin: 0.5rem 0; }
        .result .snippet { color: #aaa; line-height: 1.6; font-size: 0.9rem; }
        
        /* IMAGES GRID */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }
        .image-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .image-card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
        }
        .image-card .img-wrapper {
            width: 100%;
            height: 180px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .image-card .info {
            padding: 0.75rem;
        }
        .image-card .title {
            font-size: 0.8rem;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* VIDEOS GRID */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .video-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-card:hover {
            transform: translateY(-5px);
            border-color: #7c3aed;
        }
        .video-card .thumb-wrapper {
            position: relative;
            width: 100%;
            height: 160px;
            background: #222;
        }
        .video-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .video-card .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .video-card .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-card:hover .play-overlay { opacity: 1; }
        .video-card .play-btn {
            background: #7c3aed;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .video-card .info { padding: 0.75rem; }
        .video-card .title {
            font-size: 0.85rem;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .video-card .channel {
            font-size: 0.7rem;
            color: #666;
            margin-top: 0.5rem;
        }
        
        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
        }
        .lightbox .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .lightbox .nav-btn:hover { background: rgba(255,255,255,0.2); }
        .lightbox .prev { left: 1rem; }
        .lightbox .next { right: 1rem; }
        .lightbox .close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        /* VIDEO PLAYER */
        .video-player {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .video-player.active { display: flex; }
        .video-player iframe {
            width: 90%;
            height: 80%;
            border-radius: 8px;
        }
        .video-player .close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .stats {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
        
        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.8rem;
        }
        
        .footer a { color: #00d4ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Serper Search</h1>
    </div>
    
    <div class="container">
        <div class="search-box">
            <form id="search-form">
                <input type="text" id="query" placeholder="O que você quer pesquisar?" required>
                <button type="submit" id="search-btn">🔍 Pesquisar</button>
            </form>
        </div>
        
        <div class="tabs">
            <div class="tab active" data-type="web" onclick="setTab('web')">🌐 Web</div>
            <div class="tab" data-type="images" onclick="setTab('images')">🖼️ Imagens</div>
            <div class="tab" data-type="news" onclick="setTab('news')">📰 Notícias</div>
            <div class="tab" data-type="videos" onclick="setTab('videos')">🎬 Vídeos</div>
        </div>
        
        <div id="stats" class="stats" style="display:none"></div>
        <div id="error" class="error" style="display:none"></div>
        <div id="results" class="results"></div>
    </div>
    
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="handleLightboxClick(event)">
        <button class="close" onclick="closeLightbox()">✕</button>
        <button class="nav-btn prev" onclick="prevImage(event)">❮</button>
        <img id="lightbox-img" src="" alt="Image">
        <button class="nav-btn next" onclick="nextImage(event)">❯</button>
    </div>
    
    <!-- Video player -->
    <div class="video-player" id="video-player" onclick="closeVideo(event)">
        <button class="close" onclick="closeVideo()">✕</button>
        <iframe id="video-iframe" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
    </div>
    
    <div class="footer">
        Powered by <a href="https://serper.dev" target="_blank">Serper.dev</a>
    </div>

    <script>
        const API_KEY = 'c16e7b0634206ae7f8faf87fa57feb554395bad8';
        let currentType = 'web';
        let currentImages = [];
        let currentImageIndex = 0;
        
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            const btn = document.getElementById('search-btn');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            const stats = document.getElementById('stats');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Pesquisando...';
            error.style.display = 'none';
            results.innerHTML = '';
            
            try {
                const response = await fetch(`https://google.serper.dev/${currentType}`, {
                    method: 'POST',
                    headers: {
                        'X-API-KEY': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ q: query })
                });
                
                if (!response.ok) throw new Error('Erro na API: ' + response.status);
                
                const data = await response.json();
                
                if (data.searchInformation) {
                    stats.innerHTML = 'Encontrado em ' + (data.searchInformation.formattedSearchTime || '?') + 's';
                    stats.style.display = 'block';
                }
                
                if (currentType === 'web') renderWebResults(data);
                else if (currentType === 'images') renderImageResults(data);
                else if (currentType === 'news') renderNewsResults(data);
                else if (currentType === 'videos') renderVideoResults(data);
                
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
            }
            
            btn.disabled = false;
            btn.innerHTML = '🔍 Pesquisar';
        });
        
        function renderWebResults(data) {
            const results = document.getElementById('results');
            if (!data.organic || data.organic.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhum resultado encontrado</p>';
                return;
            }
            
            results.innerHTML = data.organic.map(item => `
                <div class="result">
                    <a href="${item.link}" target="_blank">${item.title}</a>
                    <div class="url">${item.link}</div>
                    <div class="snippet">${item.snippet || ''}</div>
                </div>
            `).join('');
        }
        
        function renderImageResults(data) {
            const results = document.getElementById('results');
            currentImages = data.images || [];
            currentImageIndex = 0;
            
            if (currentImages.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhuma imagem encontrada</p>';
                return;
            }
            
            results.innerHTML = '<div class="images-grid">' + currentImages.map((item, index) => `
                <div class="image-card" onclick="openLightbox(${index})">
                    <div class="img-wrapper">
                        <img src="${item.imageUrl}" alt="${item.title || 'Image'}" 
                             onerror="this.style.display='none';this.parentElement.innerHTML='🖼️'">
                    </div>
                    <div class="info">
                        <div class="title">${item.title || ''}</div>
                    </div>
                </div>
            `).join('') + '</div>';
        }
        
        function renderVideoResults(data) {
            const results = document.getElementById('results');
            const videos = data.videos || [];
            
            if (videos.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhum vídeo encontrado</p>';
                return;
            }
            
            results.innerHTML = '<div class="videos-grid">' + videos.map(item => `
                <div class="video-card" onclick="playVideo('${escapeHtml(item.link)}')">
                    <div class="thumb-wrapper">
                        <img src="${item.thumbnail}" alt="${item.title || 'Video'}"
                             onerror="this.style.display='none'">
                        <div class="play-overlay">
                            <div class="play-btn">▶</div>
                        </div>
                        ${item.duration ? `<div class="duration">${item.duration}</div>` : ''}
                    </div>
                    <div class="info">
                        <div class="title">${item.title || ''}</div>
                        <div class="channel">${item.channel || ''}</div>
                    </div>
                </div>
            `).join('') + '</div>';
        }
        
        function renderNewsResults(data) {
            const results = document.getElementById('results');
            if (!data.news || data.news.length === 0) {
                results.innerHTML = '<p style="color:#888;text-align:center">Nenhuma notícia encontrada</p>';
                return;
            }
            
            results.innerHTML = data.news.map(item => `
                <div class="result">
                    <span style="color:#7c3aed;font-size:0.8rem;font-weight:600">${item.source}</span>
                    <span style="color:#666;font-size:0.75rem;margin-left:0.5rem">${item.date || ''}</span>
                    <a href="${item.link}" target="_blank" style="display:block;margin:0.5rem 0">${item.title}</a>
                    <div class="snippet">${item.snippet || ''}</div>
                </div>
            `).join('');
        }
        
        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
        
        // Lightbox functions
        function openLightbox(index) {
            if (!currentImages[index]) return;
            currentImageIndex = index;
            document.getElementById('lightbox-img').src = currentImages[index].imageUrl;
            document.getElementById('lightbox').classList.add('active');
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightbox-img').src = '';
        }
        
        function prevImage(e) {
            e.stopPropagation();
            if (currentImageIndex > 0) {
                currentImageIndex--;
                document.getElementById('lightbox-img').src = currentImages[currentImageIndex].imageUrl;
            }
        }
        
        function nextImage(e) {
            e.stopPropagation();
            if (currentImageIndex < currentImages.length - 1) {
                currentImageIndex++;
                document.getElementById('lightbox-img').src = currentImages[currentImageIndex].imageUrl;
            }
        }
        
        function handleLightboxClick(e) {
            if (e.target === document.getElementById('lightbox')) {
                closeLightbox();
            }
        }
        
        // Video player
        function playVideo(link) {
            let embedUrl = link;
            if (link.includes('youtube.com/watch')) {
                const videoId = link.split('v=')[1]?.split('&')[0];
                embedUrl = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
            } else if (link.includes('youtu.be/')) {
                const videoId = link.split('youtu.be/')[1]?.split('?')[0];
                embedUrl = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
            }
            
            document.getElementById('video-iframe').src = embedUrl;
            document.getElementById('video-player').classList.add('active');
        }
        
        function closeVideo(e) {
            if (!e || e.target.id === 'video-player') {
                document.getElementById('video-iframe').src = '';
                document.getElementById('video-player').classList.remove('active');
            }
        }
        
        function setTab(type) {
            currentType = type;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
                closeVideo();
            } else if (e.key === 'ArrowLeft' && document.getElementById('lightbox').classList.contains('active')) {
                prevImage(e);
            } else if (e.key === 'ArrowRight' && document.getElementById('lightbox').classList.contains('active')) {
                nextImage(e);
            }
        });
    </script>
</body>
</html>
